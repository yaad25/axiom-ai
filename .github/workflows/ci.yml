name: Noor AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Engine (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn requests pydantic

    - name: Smoke test model backend
      run: |
        python -c "from server.model import get_backend; b = get_backend('noor-fast'); res = b.decide('test', {'type': 'choice', 'criteria': {'a': 'b'}}); print(res)"

    - name: Run benchmark harness test
      run: |
        python examples/bench.py examples/sample.jsonl --targets yours
