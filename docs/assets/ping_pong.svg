<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Dark Window Frame -->
  <rect width="960" height="540" fill="#090d12" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <!-- macOS Window Header Buttons -->
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="46" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="24" r="6" fill="#10b981"/>
  
  <!-- Title bar text -->
  <text x="480" y="28" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">axiom-ping-pong / real recorded decisions</text>

  <line x1="0" y1="48" x2="960" y2="48" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Info Row -->
  <text x="36" y="80" fill="#94a3b8" font-family="monospace" font-size="16" font-weight="bold">AXIOM AI <tspan fill="#475569"> / </tspan> LOCAL INTELLIGENCE</text>
  <text x="924" y="80" fill="#10b981" font-family="monospace" font-size="14" text-anchor="end" font-weight="bold">RECORDED RUN • 1x</text>

  <!-- Left Game Section -->
  <text x="36" y="125" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="4">P I N G   P O N G</text>
  <text x="360" y="125" fill="#64748b" font-family="monospace" font-size="14" text-anchor="end">MATCH 05</text>

  <!-- Game Canvas Container (Green Table) -->
  <rect x="36" y="145" width="330" height="270" fill="#064e3b" stroke="#047857" stroke-width="2" rx="4"/>
  <line x1="201" y1="145" x2="201" y2="415" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Left Paddle -->
  <rect x="56" y="220" width="10" height="50" fill="#f43f5e" rx="3"/>

  <!-- Right Paddle (Axiom AI) -->
  <rect x="336" y="220" width="10" height="50" fill="#38bdf8" rx="3" stroke="#93c5fd" stroke-width="2">
    <animate attributeName="y" values="220;180;250;220" dur="1.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Ball Trajectory -->
  <polyline points="66,245 201,190 336,235" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="66" cy="245" r="7" fill="#facc15">
    <animate attributeName="cx" values="66;201;336;201;66" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="245;190;235;290;245" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Score Board Section -->
  <g font-family="monospace">
    <text x="36" y="445" fill="#64748b" font-size="12">AI SCORE</text>
    <text x="36" y="485" fill="#34d399" font-size="34" font-weight="bold">011</text>

    <text x="160" y="445" fill="#64748b" font-size="12">OPPONENT</text>
    <text x="160" y="485" fill="#f8fafc" font-size="34" font-weight="bold">003</text>

    <text x="280" y="445" fill="#64748b" font-size="12">RALLY</text>
    <text x="280" y="485" fill="#64748b" font-size="34" font-weight="bold">048</text>

    <rect x="36" y="505" width="330" height="4" fill="#1e293b" rx="2"/>
    <rect x="36" y="505" width="260" height="4" fill="#34d399" rx="2"/>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(420, 110)" font-family="monospace">
    <text x="0" y="20" fill="#f8fafc" font-size="18" font-weight="bold">Axiom Rally Predictor</text>
    <text x="0" y="42" fill="#64748b" font-size="13">Hyper-Speed Rally Auto-Pilot • Sub-1ms</text>

    <!-- Next Move & Probabilities Header -->
    <text x="0" y="85" fill="#f8fafc" font-size="13" font-weight="bold" letter-spacing="1">NEXT MOVE</text>
    <text x="150" y="85" fill="#64748b" font-size="13" font-weight="bold" letter-spacing="1">RALLY PROBABILITIES</text>

    <!-- Probability Bars -->
    <text x="0" y="115" fill="#34d399" font-size="14" font-weight="bold">&gt; TOP_SPIN_SMASH</text>
    <rect x="150" y="104" width="130" height="14" fill="#34d399">
      <animate attributeName="width" values="130;145;130" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="280" y="115" fill="#34d399" font-size="14" font-weight="bold">0.96</text>

    <text x="16" y="140" fill="#64748b" font-size="13">SLICE_DEFENSE</text>
    <rect x="150" y="129" width="10" height="14" fill="#334155"/>
    <text x="280" y="140" fill="#64748b" font-size="13">0.03</text>

    <text x="80" y="165" fill="#64748b" font-size="13">LOB</text>
    <rect x="150" y="154" width="4" height="14" fill="#334155"/>
    <text x="280" y="165" fill="#64748b" font-size="13">0.01</text>

    <!-- Executing Action -->
    <text x="0" y="235" fill="#64748b" font-size="13">EXECUTING</text>
    <text x="120" y="235" fill="#34d399" font-size="15" font-weight="bold">TOP_SPIN_SMASH</text>

    <!-- Risk Metrics -->
    <text x="0" y="270" fill="#64748b" font-size="12">POINT WIN PROBABILITY</text>
    <rect x="0" y="280" width="220" height="2" fill="#1e293b"/>
    <rect x="0" y="280" width="210" height="2" fill="#34d399"/>
    <text x="280" y="275" fill="#34d399" font-size="13">0.96</text>

    <text x="0" y="315" fill="#64748b" font-size="12">OUT OF BOUNDS RISK</text>
    <rect x="0" y="325" width="220" height="2" fill="#1e293b"/>
    <rect x="0" y="325" width="8" height="2" fill="#f59e0b"/>
    <text x="280" y="320" fill="#f59e0b" font-size="13">0.02</text>

    <!-- System Telemetry Stats -->
    <g transform="translate(0, 355)" font-size="12">
      <text x="0" y="0" fill="#64748b">INFERENCE</text>
      <text x="160" y="0" fill="#4ade80" font-weight="bold">0.07 ms</text>

      <text x="0" y="20" fill="#64748b">DECISIONS</text>
      <text x="160" y="20" fill="#f8fafc" font-weight="bold">14,285 /s</text>

      <text x="0" y="40" fill="#64748b">NETWORK</text>
      <text x="160" y="40" fill="#38bdf8" font-weight="bold">OFFLINE (0 Cloud Fees)</text>

      <text x="0" y="60" fill="#64748b">ENGINE</text>
      <text x="160" y="60" fill="#a855f7" font-weight="bold">Axiom Fast • Sub-1ms CPU</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <line x1="0" y1="500" x2="960" y2="500" stroke="#1e293b" stroke-width="1.5"/>
  <text x="36" y="524" fill="#64748b" font-family="monospace" font-size="12">SPACE pause    ↑/↓ speed    R reset    Q quit</text>
  <text x="924" y="524" fill="#475569" font-family="monospace" font-size="12" text-anchor="end">ESTIMATES BY AXIOM AI ENGINE</text>
</svg>
