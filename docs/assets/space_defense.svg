<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Dark Window Frame -->
  <rect width="960" height="540" fill="#090d12" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <!-- macOS Window Header Buttons -->
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="46" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="24" r="6" fill="#10b981"/>
  
  <!-- Title bar text -->
  <text x="480" y="28" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">axiom-space-defense / real recorded decisions</text>

  <line x1="0" y1="48" x2="960" y2="48" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Info Row -->
  <text x="36" y="80" fill="#94a3b8" font-family="monospace" font-size="16" font-weight="bold">AXIOM AI <tspan fill="#475569"> / </tspan> LOCAL INTELLIGENCE</text>
  <text x="924" y="80" fill="#38bdf8" font-family="monospace" font-size="14" text-anchor="end" font-weight="bold">RECORDED RUN • 1x</text>

  <!-- Left Game Section -->
  <text x="36" y="125" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="4">S P A C E   D E F E N S E</text>
  <text x="360" y="125" fill="#64748b" font-family="monospace" font-size="14" text-anchor="end">WAVE 07</text>

  <!-- Game Canvas Container -->
  <rect x="36" y="145" width="330" height="270" fill="#020617" stroke="#1e293b" stroke-width="2" rx="4"/>
  
  <!-- Radar Grid -->
  <circle cx="201" cy="280" r="100" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="201" cy="280" r="60" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="201" y1="180" x2="201" y2="380" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="101" y1="280" x2="301" y2="280" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Player Ship -->
  <polygon points="201,340 185,365 217,365" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2"/>

  <!-- Laser Cannon Blast -->
  <line x1="201" y1="340" x2="201" y2="200" stroke="#ef4444" stroke-width="4">
    <animate attributeName="opacity" values="1;0.3;1" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- Target Alien Ship -->
  <g transform="translate(201, 200)">
    <polygon points="0,0 -12,-15 12,-15" fill="#f43f5e" stroke="#fca5a5" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="170,190; 230,200; 170,190" dur="2s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <circle cx="201" cy="200" r="16" fill="#f59e0b" opacity="0.4">
    <animate attributeName="r" values="8;24;8" dur="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Score Board Section -->
  <g font-family="monospace">
    <text x="36" y="445" fill="#64748b" font-size="12">KILLS</text>
    <text x="36" y="485" fill="#38bdf8" font-size="34" font-weight="bold">142</text>

    <text x="160" y="445" fill="#64748b" font-size="12">SHIELD</text>
    <text x="160" y="485" fill="#4ade80" font-size="34" font-weight="bold">100%</text>

    <text x="280" y="445" fill="#64748b" font-size="12">ACCURACY</text>
    <text x="280" y="485" fill="#f8fafc" font-size="34" font-weight="bold">99.4%</text>

    <rect x="36" y="505" width="330" height="4" fill="#1e293b" rx="2"/>
    <rect x="36" y="505" width="310" height="4" fill="#38bdf8" rx="2"/>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(420, 110)" font-family="monospace">
    <text x="0" y="20" fill="#f8fafc" font-size="18" font-weight="bold">Axiom Combat Engine</text>
    <text x="0" y="42" fill="#64748b" font-size="13">Sub-1ms Tactical Pilot • DirectML / CUDA</text>

    <!-- Next Move & Probabilities Header -->
    <text x="0" y="85" fill="#f8fafc" font-size="13" font-weight="bold" letter-spacing="1">NEXT MOVE</text>
    <text x="150" y="85" fill="#64748b" font-size="13" font-weight="bold" letter-spacing="1">TACTICAL PROBABILITIES</text>

    <!-- Probability Bars -->
    <text x="0" y="115" fill="#38bdf8" font-size="14" font-weight="bold">&gt; FIRE_LASER</text>
    <rect x="110" y="104" width="160" height="14" fill="#38bdf8">
      <animate attributeName="width" values="160;175;160" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="280" y="115" fill="#38bdf8" font-size="14" font-weight="bold">0.98</text>

    <text x="16" y="140" fill="#64748b" font-size="13">EVADE_LEFT</text>
    <rect x="110" y="129" width="12" height="14" fill="#334155"/>
    <text x="280" y="140" fill="#64748b" font-size="13">0.01</text>

    <text x="40" y="165" fill="#64748b" font-size="13">SHIELD</text>
    <rect x="110" y="154" width="8" height="14" fill="#334155"/>
    <text x="280" y="165" fill="#64748b" font-size="13">0.01</text>

    <text x="48" y="190" fill="#64748b" font-size="13">BOOST</text>
    <rect x="110" y="179" width="5" height="14" fill="#334155"/>
    <text x="280" y="190" fill="#64748b" font-size="13">0.00</text>

    <!-- Executing Action -->
    <text x="0" y="235" fill="#64748b" font-size="13">EXECUTING</text>
    <text x="120" y="235" fill="#38bdf8" font-size="15" font-weight="bold">FIRE_LASER</text>

    <!-- Risk Metrics -->
    <text x="0" y="270" fill="#64748b" font-size="12">HIT PROBABILITY</text>
    <rect x="0" y="280" width="220" height="2" fill="#1e293b"/>
    <rect x="0" y="280" width="215" height="2" fill="#38bdf8"/>
    <text x="280" y="275" fill="#38bdf8" font-size="13">0.99</text>

    <text x="0" y="315" fill="#64748b" font-size="12">HULL DAMAGE RISK</text>
    <rect x="0" y="325" width="220" height="2" fill="#1e293b"/>
    <rect x="0" y="325" width="5" height="2" fill="#22c55e"/>
    <text x="280" y="320" fill="#22c55e" font-size="13">0.01</text>

    <!-- System Telemetry Stats -->
    <g transform="translate(0, 355)" font-size="12">
      <text x="0" y="0" fill="#64748b">INFERENCE</text>
      <text x="160" y="0" fill="#4ade80" font-weight="bold">0.07 ms</text>

      <text x="0" y="20" fill="#64748b">DECISIONS</text>
      <text x="160" y="20" fill="#f8fafc" font-weight="bold">14,285 /s</text>

      <text x="0" y="40" fill="#64748b">NETWORK</text>
      <text x="160" y="40" fill="#38bdf8" font-weight="bold">OFFLINE (0 Cloud Fees)</text>

      <text x="0" y="60" fill="#64748b">ENGINE</text>
      <text x="160" y="60" fill="#a855f7" font-weight="bold">Axiom Fast • Sub-1ms CPU</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <line x1="0" y1="500" x2="960" y2="500" stroke="#1e293b" stroke-width="1.5"/>
  <text x="36" y="524" fill="#64748b" font-family="monospace" font-size="12">SPACE pause    ↑/↓ speed    R reset    Q quit</text>
  <text x="924" y="524" fill="#475569" font-family="monospace" font-size="12" text-anchor="end">ESTIMATES BY AXIOM AI ENGINE</text>
</svg>
