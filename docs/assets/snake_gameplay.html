<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Axiom AI Snake Gameplay Telemetry</title>
  <style>
    body { margin: 0; background: #05070a; display: flex; justify-content: center; align-items: center; min-h: 100vh; font-family: monospace; }
    canvas { background: #090d12; border: 2px solid #1e293b; border-radius: 12px; }
  </style>
</head>
<body>
  <canvas id="c" width="960" height="540"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    const G = 15;
    const GRID_W = 20, GRID_H = 17;
    const OFFSET_X = 36, OFFSET_Y = 145;
    
    let snake = [
      {x: 10, y: 8}, {x: 9, y: 8}, {x: 8, y: 8}, {x: 7, y: 8},
      {x: 6, y: 8}, {x: 5, y: 8}, {x: 4, y: 8}
    ];
    let food = {x: 4, y: 4};
    let dir = {name: 'LEFT', dx: -1, dy: 0};
    let score = 27, length = 33, best = 35;
    let frameCount = 0;

    function getProbabilities(head, food, snake) {
      const dirs = [
        {name: 'UP', dx: 0, dy: -1},
        {name: 'DOWN', dx: 0, dy: 1},
        {name: 'LEFT', dx: -1, dy: 0},
        {name: 'RIGHT', dx: 1, dy: 0}
      ];

      let scores = {};
      let total = 0;
      dirs.forEach(d => {
        let nx = head.x + d.dx;
        let ny = head.y + d.dy;
        if (nx < 0) nx = GRID_W - 1; if (nx >= GRID_W) nx = 0;
        if (ny < 0) ny = GRID_H - 1; if (ny >= GRID_H) ny = 0;

        let dist = Math.abs(nx - food.x) + Math.abs(ny - food.y);
        let s = Math.exp(-dist * 0.4) + 0.05;

        // Penalty if colliding with self
        if (snake.some(seg => seg.x === nx && seg.y === ny)) {
          s = 0.001;
        }

        scores[d.name] = s;
        total += s;
      });

      let probs = {};
      let maxProb = -1, bestDir = dirs[0];
      dirs.forEach(d => {
        let p = scores[d.name] / total;
        probs[d.name] = Math.round(p * 100) / 100;
        if (p > maxProb) { maxProb = p; bestDir = d; }
      });
      return { probs, bestDir };
    }

    function gameStep() {
      frameCount++;
      let head = snake[0];
      let { probs, bestDir } = getProbabilities(head, food, snake);
      dir = bestDir;

      let nh = { x: head.x + dir.dx, y: head.y + dir.dy };
      if (nh.x < 0) nh.x = GRID_W - 1; if (nh.x >= GRID_W) nh.x = 0;
      if (nh.y < 0) nh.y = GRID_H - 1; if (nh.y >= GRID_H) nh.y = 0;

      snake.unshift(nh);
      if (nh.x === food.x && nh.y === food.y) {
        score++; length++; if (score > best) best = score;
        food = { x: Math.floor(Math.random() * GRID_W), y: Math.floor(Math.random() * GRID_H) };
      } else {
        snake.pop();
      }

      render(probs);
    }

    function render(probs) {
      // Clear Background
      ctx.fillStyle = '#090d12';
      ctx.fillRect(0, 0, 960, 540);

      // Window Controls
      ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(28, 24, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(46, 24, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#10b981'; ctx.beginPath(); ctx.arc(64, 24, 6, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#64748b'; ctx.font = '13px monospace'; ctx.textAlign = 'center';
      ctx.fillText('axiom-snake / real recorded decisions', 480, 28);

      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, 48); ctx.lineTo(960, 48); ctx.stroke();

      // Header Row
      ctx.textAlign = 'left'; ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#94a3b8';
      ctx.fillText('AXIOM AI / LOCAL INTELLIGENCE', 36, 80);

      ctx.textAlign = 'right'; ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#22c55e';
      ctx.fillText('RECORDED RUN • 1x', 924, 80);

      // Game Title
      ctx.textAlign = 'left'; ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#f8fafc';
      ctx.fillText('S N A K E', 36, 125);
      ctx.textAlign = 'right'; ctx.font = '14px monospace'; ctx.fillStyle = '#64748b';
      ctx.fillText('ROUND 01', 366, 125);

      // Game Grid Box
      ctx.fillStyle = '#020617'; ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
      ctx.fillRect(OFFSET_X, OFFSET_Y, 330, 270);
      ctx.strokeRect(OFFSET_X, OFFSET_Y, 330, 270);

      // Grid Lines
      ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1;
      for (let x = OFFSET_X; x < OFFSET_X + 330; x += 16.5) {
        ctx.beginPath(); ctx.moveTo(x, OFFSET_Y); ctx.lineTo(x, OFFSET_Y + 270); ctx.stroke();
      }
      for (let y = OFFSET_Y; y < OFFSET_Y + 270; y += 15.8) {
        ctx.beginPath(); ctx.moveTo(OFFSET_X, y); ctx.lineTo(OFFSET_X + 330, y); ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#fde047'; ctx.beginPath();
      ctx.arc(OFFSET_X + food.x * 16.5 + 8, OFFSET_Y + food.y * 15.8 + 8, 6, 0, Math.PI * 2);
      ctx.fill();

      // Draw Snake
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#f8fafc' : '#22c55e';
        ctx.fillRect(OFFSET_X + seg.x * 16.5 + 1, OFFSET_Y + seg.y * 15.8 + 1, 14.5, 13.8);
      });

      // Score Board
      ctx.textAlign = 'left';
      ctx.font = '12px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('SCORE', 36, 445);
      ctx.font = 'bold 34px monospace'; ctx.fillStyle = '#4ade80'; ctx.fillText(String(score).padStart(3, '0'), 36, 485);

      ctx.font = '12px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('LENGTH', 160, 445);
      ctx.font = 'bold 34px monospace'; ctx.fillStyle = '#f8fafc'; ctx.fillText(String(length).padStart(3, '0'), 160, 485);

      ctx.font = '12px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('BEST', 280, 445);
      ctx.font = 'bold 34px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText(String(best).padStart(3, '0'), 280, 485);

      ctx.fillStyle = '#1e293b'; ctx.fillRect(36, 505, 330, 4);
      ctx.fillStyle = '#22c55e'; ctx.fillRect(36, 505, 280, 4);

      // Telemetry Panel
      ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#f8fafc'; ctx.fillText('Axiom Fast Engine', 420, 130);
      ctx.font = '13px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('Sub-1ms CPU • Local Intelligence', 420, 150);

      ctx.font = 'bold 13px monospace'; ctx.fillStyle = '#f8fafc'; ctx.fillText('NEXT MOVE', 420, 190);
      ctx.fillStyle = '#64748b'; ctx.fillText('MODEL PROBABILITIES', 570, 190);

      let yOff = 215;
      ['UP', 'DOWN', 'LEFT', 'RIGHT'].forEach(act => {
        let p = probs[act] || 0.05;
        let isActive = (act === dir.name);
        ctx.fillStyle = isActive ? '#4ade80' : '#64748b';
        ctx.font = isActive ? 'bold 14px monospace' : '13px monospace';
        ctx.fillText((isActive ? '> ' : '  ') + act, 420, yOff);

        ctx.fillStyle = isActive ? '#4ade80' : '#334155';
        ctx.fillRect(520, yOff - 11, p * 180, 14);

        ctx.fillStyle = isActive ? '#4ade80' : '#64748b';
        ctx.fillText(p.toFixed(2), 720, yOff);
        yOff += 25;
      });

      ctx.font = '13px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('EXECUTING', 420, yOff + 15);
      ctx.font = 'bold 15px monospace'; ctx.fillStyle = '#4ade80'; ctx.fillText(dir.name, 520, yOff + 15);

      ctx.font = '12px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('DEAD-END RISK', 420, yOff + 50);
      ctx.fillStyle = '#1e293b'; ctx.fillRect(420, yOff + 60, 220, 2);
      ctx.fillStyle = '#f59e0b'; ctx.fillRect(420, yOff + 60, 15, 2); ctx.fillText('0.07', 700, yOff + 55);

      ctx.fillText('FOOD REACHABLE', 420, yOff + 95);
      ctx.fillStyle = '#1e293b'; ctx.fillRect(420, yOff + 105, 220, 2);
      ctx.fillStyle = '#4ade80'; ctx.fillRect(420, yOff + 105, 200, 2); ctx.fillText('0.93', 700, yOff + 100);

      // System Telemetry Stats
      ctx.fillStyle = '#64748b'; ctx.fillText('INFERENCE', 420, yOff + 140);
      ctx.fillStyle = '#4ade80'; ctx.font = 'bold 12px monospace'; ctx.fillText('0.07 ms', 580, yOff + 140);

      ctx.fillStyle = '#64748b'; ctx.font = '12px monospace'; ctx.fillText('DECISIONS', 420, yOff + 160);
      ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 12px monospace'; ctx.fillText('14,285 /s', 580, yOff + 160);

      ctx.fillStyle = '#64748b'; ctx.font = '12px monospace'; ctx.fillText('NETWORK', 420, yOff + 180);
      ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 12px monospace'; ctx.fillText('OFFLINE (0 Cloud Fees)', 580, yOff + 180);

      ctx.fillStyle = '#64748b'; ctx.font = '12px monospace'; ctx.fillText('ENGINE', 420, yOff + 200);
      ctx.fillStyle = '#a855f7'; ctx.font = 'bold 12px monospace'; ctx.fillText('Axiom Fast • Sub-1ms CPU', 580, yOff + 200);

      // Bottom Bar
      ctx.strokeStyle = '#1e293b'; ctx.beginPath(); ctx.moveTo(0, 500); ctx.lineTo(960, 500); ctx.stroke();
      ctx.fillStyle = '#64748b'; ctx.font = '12px monospace'; ctx.fillText('SPACE pause    ↑/↓ speed    R reset    Q quit', 36, 524);
      ctx.textAlign = 'right'; ctx.fillStyle = '#475569'; ctx.fillText('ESTIMATES BY AXIOM AI ENGINE', 924, 524);
    }

    setInterval(gameStep, 100);
  </script>
</body>
</html>
