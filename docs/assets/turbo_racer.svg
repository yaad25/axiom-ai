<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Dark Window Frame -->
  <rect width="960" height="540" fill="#090d12" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <!-- macOS Window Header Buttons -->
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="46" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="24" r="6" fill="#10b981"/>
  
  <!-- Title bar text -->
  <text x="480" y="28" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">axiom-turbo-racer / real recorded decisions</text>

  <line x1="0" y1="48" x2="960" y2="48" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Info Row -->
  <text x="36" y="80" fill="#94a3b8" font-family="monospace" font-size="16" font-weight="bold">AXIOM AI <tspan fill="#475569"> / </tspan> LOCAL INTELLIGENCE</text>
  <text x="924" y="80" fill="#f59e0b" font-family="monospace" font-size="14" text-anchor="end" font-weight="bold">RECORDED RUN • 1x</text>

  <!-- Left Game Section -->
  <text x="36" y="125" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="4">T U R B O   R A C E R</text>
  <text x="360" y="125" fill="#64748b" font-family="monospace" font-size="14" text-anchor="end">LAP 03</text>

  <!-- Game Canvas Container -->
  <rect x="36" y="145" width="330" height="270" fill="#020617" stroke="#1e293b" stroke-width="2" rx="4"/>
  
  <!-- 3-Lane Highway -->
  <rect x="76" y="145" width="250" height="270" fill="#0f172a"/>
  <line x1="159" y1="145" x2="159" y2="415" stroke="#475569" stroke-width="3" stroke-dasharray="15,15">
    <animate attributeName="stroke-dashoffset" values="0;30" dur="0.4s" repeatCount="indefinite"/>
  </line>
  <line x1="242" y1="145" x2="242" y2="415" stroke="#475569" stroke-width="3" stroke-dasharray="15,15">
    <animate attributeName="stroke-dashoffset" values="0;30" dur="0.4s" repeatCount="indefinite"/>
  </line>

  <!-- Player Car (Yellow) -->
  <g transform="translate(118, 330)">
    <rect x="-14" y="-22" width="28" height="44" fill="#eab308" rx="5" stroke="#fef08a" stroke-width="2"/>
    <rect x="-9" y="-12" width="18" height="10" fill="#0284c7" rx="2"/>
    <animateTransform attributeName="transform" type="translate" values="118,330; 201,330; 118,330" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Traffic Car (Red) -->
  <g transform="translate(201, 210)">
    <rect x="-14" y="-22" width="28" height="44" fill="#ef4444" rx="5" stroke="#fca5a5" stroke-width="2"/>
    <animateTransform attributeName="transform" type="translate" values="201,130; 201,450" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- Score Board Section -->
  <g font-family="monospace">
    <text x="36" y="445" fill="#64748b" font-size="12">SPEED</text>
    <text x="36" y="485" fill="#f59e0b" font-size="34" font-weight="bold">240</text>
    <text x="110" y="485" fill="#64748b" font-size="14">KM/H</text>

    <text x="175" y="445" fill="#64748b" font-size="12">DIST</text>
    <text x="175" y="485" fill="#f8fafc" font-size="34" font-weight="bold">12.4</text>
    <text x="250" y="485" fill="#64748b" font-size="14">KM</text>

    <text x="290" y="445" fill="#64748b" font-size="12">CRASHES</text>
    <text x="290" y="485" fill="#4ade80" font-size="34" font-weight="bold">000</text>

    <rect x="36" y="505" width="330" height="4" fill="#1e293b" rx="2"/>
    <rect x="36" y="505" width="290" height="4" fill="#f59e0b" rx="2"/>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(420, 110)" font-family="monospace">
    <text x="0" y="20" fill="#f8fafc" font-size="18" font-weight="bold">Axiom Highway Pilot</text>
    <text x="0" y="42" fill="#64748b" font-size="13">240 KM/H Highway Steering • Sub-1ms CPU</text>

    <!-- Next Move & Probabilities Header -->
    <text x="0" y="85" fill="#f8fafc" font-size="13" font-weight="bold" letter-spacing="1">NEXT MOVE</text>
    <text x="150" y="85" fill="#64748b" font-size="13" font-weight="bold" letter-spacing="1">STEERING PROBABILITIES</text>

    <!-- Probability Bars -->
    <text x="0" y="115" fill="#f59e0b" font-size="14" font-weight="bold">&gt; STEER_LEFT</text>
    <rect x="120" y="104" width="150" height="14" fill="#f59e0b">
      <animate attributeName="width" values="150;165;150" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="280" y="115" fill="#f59e0b" font-size="14" font-weight="bold">0.92</text>

    <text x="16" y="140" fill="#64748b" font-size="13">MAINTAIN</text>
    <rect x="120" y="129" width="18" height="14" fill="#334155"/>
    <text x="280" y="140" fill="#64748b" font-size="13">0.07</text>

    <text x="40" y="165" fill="#64748b" font-size="13">BRAKE</text>
    <rect x="120" y="154" width="5" height="14" fill="#334155"/>
    <text x="280" y="165" fill="#64748b" font-size="13">0.01</text>

    <text x="24" y="190" fill="#64748b" font-size="13">STEER_RIGHT</text>
    <rect x="120" y="179" width="0" height="14" fill="#334155"/>
    <text x="280" y="190" fill="#64748b" font-size="13">0.00</text>

    <!-- Executing Action -->
    <text x="0" y="235" fill="#64748b" font-size="13">EXECUTING</text>
    <text x="120" y="235" fill="#f59e0b" font-size="15" font-weight="bold">STEER_LEFT</text>

    <!-- Risk Metrics -->
    <text x="0" y="270" fill="#64748b" font-size="12">CRASH RISK</text>
    <rect x="0" y="280" width="220" height="2" fill="#1e293b"/>
    <rect x="0" y="280" width="8" height="2" fill="#22c55e"/>
    <text x="280" y="275" fill="#22c55e" font-size="13">0.01</text>

    <text x="0" y="315" fill="#64748b" font-size="12">CLEAR PATH</text>
    <rect x="0" y="325" width="220" height="2" fill="#1e293b"/>
    <rect x="0" y="325" width="205" height="2" fill="#f59e0b"/>
    <text x="280" y="320" fill="#f59e0b" font-size="13">0.99</text>

    <!-- System Telemetry Stats -->
    <g transform="translate(0, 355)" font-size="12">
      <text x="0" y="0" fill="#64748b">INFERENCE</text>
      <text x="160" y="0" fill="#4ade80" font-weight="bold">0.07 ms</text>

      <text x="0" y="20" fill="#64748b">DECISIONS</text>
      <text x="160" y="20" fill="#f8fafc" font-weight="bold">14,285 /s</text>

      <text x="0" y="40" fill="#64748b">NETWORK</text>
      <text x="160" y="40" fill="#38bdf8" font-weight="bold">OFFLINE (0 Cloud Fees)</text>

      <text x="0" y="60" fill="#64748b">ENGINE</text>
      <text x="160" y="60" fill="#a855f7" font-weight="bold">Axiom Fast • Sub-1ms CPU</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <line x1="0" y1="500" x2="960" y2="500" stroke="#1e293b" stroke-width="1.5"/>
  <text x="36" y="524" fill="#64748b" font-family="monospace" font-size="12">SPACE pause    ↑/↓ speed    R reset    Q quit</text>
  <text x="924" y="524" fill="#475569" font-family="monospace" font-size="12" text-anchor="end">ESTIMATES BY AXIOM AI ENGINE</text>
</svg>
