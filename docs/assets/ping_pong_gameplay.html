<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Axiom AI Ping Pong Telemetry</title>
  <style>
    body { margin: 0; background: #05070a; display: flex; justify-content: center; align-items: center; min-h: 100vh; font-family: monospace; }
    canvas { background: #090d12; border: 2px solid #1e293b; border-radius: 12px; }
  </style>
</head>
<body>
  <canvas id="c" width="960" height="540"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    const OFFSET_X = 36, OFFSET_Y = 145;
    const GAME_W = 330, GAME_H = 270;
    
    let ball = { x: 50, y: 135, vx: 5, vy: 3 };
    let paddleLeftY = 110;
    let paddleRightY = 110;
    let scoreAI = 11, scoreOpp = 3, rally = 48;

    function gameStep() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y <= 10 || ball.y >= GAME_H - 10) ball.vy *= -1;

      // Opponent paddle tracking
      paddleLeftY += (ball.y - (paddleLeftY + 25)) * 0.1;

      // Axiom AI paddle tracking
      let targetY = ball.y - 25;
      paddleRightY += (targetY - paddleRightY) * 0.2;

      // Paddle Collisions
      if (ball.x <= 20 && ball.y >= paddleLeftY && ball.y <= paddleLeftY + 50) {
        ball.vx *= -1; ball.x = 21; rally++;
      }
      if (ball.x >= GAME_W - 20 && ball.y >= paddleRightY && ball.y <= paddleRightY + 50) {
        ball.vx *= -1; ball.x = GAME_W - 21; rally++;
      }

      if (ball.x < 0) { scoreAI++; ball = { x: 165, y: 135, vx: 5, vy: 3 }; rally = 0; }
      if (ball.x > GAME_W) { scoreOpp++; ball = { x: 165, y: 135, vx: -5, vy: 3 }; rally = 0; }

      render();
    }

    function render() {
      ctx.fillStyle = '#090d12';
      ctx.fillRect(0, 0, 960, 540);

      // Window Controls
      ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(28, 24, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(46, 24, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#10b981'; ctx.beginPath(); ctx.arc(64, 24, 6, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#64748b'; ctx.font = '13px monospace'; ctx.textAlign = 'center';
      ctx.fillText('axiom-ping-pong / real recorded decisions', 480, 28);

      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, 48); ctx.lineTo(960, 48); ctx.stroke();

      // Header Row
      ctx.textAlign = 'left'; ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#94a3b8';
      ctx.fillText('AXIOM AI / LOCAL INTELLIGENCE', 36, 80);

      ctx.textAlign = 'right'; ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#10b981';
      ctx.fillText('RECORDED RUN • 1x', 924, 80);

      // Game Title
      ctx.textAlign = 'left'; ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#f8fafc';
      ctx.fillText('P I N G   P O N G', 36, 125);
      ctx.textAlign = 'right'; ctx.font = '14px monospace'; ctx.fillStyle = '#64748b';
      ctx.fillText('MATCH 05', 366, 125);

      // Game Canvas Box (Green Table)
      ctx.fillStyle = '#064e3b'; ctx.strokeStyle = '#047857'; ctx.lineWidth = 2;
      ctx.fillRect(OFFSET_X, OFFSET_Y, GAME_W, GAME_H);
      ctx.strokeRect(OFFSET_X, OFFSET_Y, GAME_W, GAME_H);

      // Net
      ctx.strokeStyle = '#a7f3d0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.setLineDash([6, 6]);
      ctx.moveTo(OFFSET_X + GAME_W/2, OFFSET_Y);
      ctx.lineTo(OFFSET_X + GAME_W/2, OFFSET_Y + GAME_H);
      ctx.stroke(); ctx.setLineDash([]);

      // Left Paddle
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(OFFSET_X + 10, OFFSET_Y + paddleLeftY, 10, 50);

      // Right Paddle (Axiom AI)
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(OFFSET_X + GAME_W - 20, OFFSET_Y + paddleRightY, 10, 50);

      // Ball
      ctx.fillStyle = '#facc15'; ctx.beginPath();
      ctx.arc(OFFSET_X + ball.x, OFFSET_Y + ball.y, 7, 0, Math.PI * 2);
      ctx.fill();

      // Score Board
      ctx.textAlign = 'left';
      ctx.font = '12px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('AI SCORE', 36, 445);
      ctx.font = 'bold 34px monospace'; ctx.fillStyle = '#34d399'; ctx.fillText(String(scoreAI).padStart(3, '0'), 36, 485);

      ctx.font = '12px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('OPPONENT', 160, 445);
      ctx.font = 'bold 34px monospace'; ctx.fillStyle = '#f8fafc'; ctx.fillText(String(scoreOpp).padStart(3, '0'), 160, 485);

      ctx.font = '12px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('RALLY', 280, 445);
      ctx.font = 'bold 34px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText(String(rally).padStart(3, '0'), 280, 485);

      ctx.fillStyle = '#1e293b'; ctx.fillRect(36, 505, 330, 4);
      ctx.fillStyle = '#34d399'; ctx.fillRect(36, 505, 260, 4);

      // Telemetry Panel
      ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#f8fafc'; ctx.fillText('Axiom Rally Predictor', 420, 130);
      ctx.font = '13px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('Hyper-Speed Rally Auto-Pilot • Sub-1ms', 420, 150);

      ctx.font = 'bold 13px monospace'; ctx.fillStyle = '#f8fafc'; ctx.fillText('NEXT MOVE', 420, 190);
      ctx.fillStyle = '#64748b'; ctx.fillText('RALLY PROBABILITIES', 570, 190);

      let probs = [
        { name: 'TOP_SPIN_SMASH', prob: 0.96 },
        { name: 'SLICE_DEFENSE', prob: 0.03 },
        { name: 'LOB', prob: 0.01 }
      ];

      let yOff = 215;
      probs.forEach((item, idx) => {
        let isActive = idx === 0;
        ctx.fillStyle = isActive ? '#34d399' : '#64748b';
        ctx.font = isActive ? 'bold 14px monospace' : '13px monospace';
        ctx.fillText((isActive ? '> ' : '  ') + item.name, 420, yOff);

        ctx.fillStyle = isActive ? '#34d399' : '#334155';
        ctx.fillRect(570, yOff - 11, item.prob * 180, 14);

        ctx.fillStyle = isActive ? '#34d399' : '#64748b';
        ctx.fillText(item.prob.toFixed(2), 770, yOff);
        yOff += 25;
      });

      ctx.font = '13px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('EXECUTING', 420, yOff + 15);
      ctx.font = 'bold 15px monospace'; ctx.fillStyle = '#34d399'; ctx.fillText('TOP_SPIN_SMASH', 570, yOff + 15);

      ctx.font = '12px monospace'; ctx.fillStyle = '#64748b'; ctx.fillText('POINT WIN PROBABILITY', 420, yOff + 50);
      ctx.fillStyle = '#1e293b'; ctx.fillRect(420, yOff + 60, 220, 2);
      ctx.fillStyle = '#34d399'; ctx.fillRect(420, yOff + 60, 210, 2); ctx.fillText('0.96', 700, yOff + 55);

      ctx.fillText('OUT OF BOUNDS RISK', 420, yOff + 95);
      ctx.fillStyle = '#1e293b'; ctx.fillRect(420, yOff + 105, 220, 2);
      ctx.fillStyle = '#f59e0b'; ctx.fillRect(420, yOff + 105, 8, 2); ctx.fillText('0.02', 700, yOff + 100);

      // System Telemetry Stats
      ctx.fillStyle = '#64748b'; ctx.fillText('INFERENCE', 420, yOff + 140);
      ctx.fillStyle = '#4ade80'; ctx.font = 'bold 12px monospace'; ctx.fillText('0.07 ms', 580, yOff + 140);

      ctx.fillStyle = '#64748b'; ctx.font = '12px monospace'; ctx.fillText('DECISIONS', 420, yOff + 160);
      ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 12px monospace'; ctx.fillText('14,285 /s', 580, yOff + 160);

      ctx.fillStyle = '#64748b'; ctx.font = '12px monospace'; ctx.fillText('NETWORK', 420, yOff + 180);
      ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 12px monospace'; ctx.fillText('OFFLINE (0 Cloud Fees)', 580, yOff + 180);

      ctx.fillStyle = '#64748b'; ctx.font = '12px monospace'; ctx.fillText('ENGINE', 420, yOff + 200);
      ctx.fillStyle = '#a855f7'; ctx.font = 'bold 12px monospace'; ctx.fillText('Axiom Fast • Sub-1ms CPU', 580, yOff + 200);

      // Bottom Bar
      ctx.strokeStyle = '#1e293b'; ctx.beginPath(); ctx.moveTo(0, 500); ctx.lineTo(960, 500); ctx.stroke();
      ctx.fillStyle = '#64748b'; ctx.font = '12px monospace'; ctx.fillText('SPACE pause    ↑/↓ speed    R reset    Q quit', 36, 524);
      ctx.textAlign = 'right'; ctx.fillStyle = '#475569'; ctx.fillText('ESTIMATES BY AXIOM AI ENGINE', 924, 524);
    }

    setInterval(gameStep, 30);
  </script>
</body>
</html>
