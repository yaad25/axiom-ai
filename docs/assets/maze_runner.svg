<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Dark Window Frame -->
  <rect width="960" height="540" fill="#090d12" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <!-- macOS Window Header Buttons -->
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="46" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="24" r="6" fill="#10b981"/>
  
  <!-- Title bar text -->
  <text x="480" y="28" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">axiom-maze-runner / real recorded decisions</text>

  <line x1="0" y1="48" x2="960" y2="48" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Info Row -->
  <text x="36" y="80" fill="#94a3b8" font-family="monospace" font-size="16" font-weight="bold">AXIOM AI <tspan fill="#475569"> / </tspan> LOCAL INTELLIGENCE</text>
  <text x="924" y="80" fill="#a855f7" font-family="monospace" font-size="14" text-anchor="end" font-weight="bold">RECORDED RUN • 1x</text>

  <!-- Left Game Section -->
  <text x="36" y="125" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="4">M A Z E   R U N N E R</text>
  <text x="360" y="125" fill="#64748b" font-family="monospace" font-size="14" text-anchor="end">LEVEL 09</text>

  <!-- Game Canvas Container -->
  <rect x="36" y="145" width="330" height="270" fill="#020617" stroke="#1e293b" stroke-width="2" rx="4"/>

  <!-- Maze Walls -->
  <g stroke="#4338ca" stroke-width="3">
    <line x1="86" y1="185" x2="86" y2="335"/>
    <line x1="136" y1="225" x2="136" y2="375"/>
    <line x1="186" y1="185" x2="186" y2="315"/>
    <line x1="236" y1="245" x2="236" y2="375"/>
    <line x1="286" y1="185" x2="286" y2="335"/>
  </g>

  <!-- Optimal Path Line -->
  <polyline points="56,205 56,355 116,355 116,205 166,205 166,355 216,355 216,205 266,205 266,355 316,355 316,205" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="8,8">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="0.8s" repeatCount="indefinite"/>
  </polyline>

  <!-- Player Agent -->
  <circle cx="56" cy="205" r="9" fill="#ec4899" stroke="#fbcfe8" stroke-width="2">
    <animate attributeName="r" values="8;11;8" dur="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Target Goal -->
  <circle cx="316" cy="205" r="10" fill="#22c55e" stroke="#bbf7d0" stroke-width="2"/>

  <!-- Score Board Section -->
  <g font-family="monospace">
    <text x="36" y="445" fill="#64748b" font-size="12">OPTIMALITY</text>
    <text x="36" y="485" fill="#a855f7" font-size="34" font-weight="bold">100%</text>

    <text x="170" y="445" fill="#64748b" font-size="12">STEPS</text>
    <text x="170" y="485" fill="#f8fafc" font-size="34" font-weight="bold">042</text>

    <text x="280" y="445" fill="#64748b" font-size="12">TIME</text>
    <text x="280" y="485" fill="#64748b" font-size="34" font-weight="bold">0.03s</text>

    <rect x="36" y="505" width="330" height="4" fill="#1e293b" rx="2"/>
    <rect x="36" y="505" width="330" height="4" fill="#a855f7" rx="2"/>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(420, 110)" font-family="monospace">
    <text x="0" y="20" fill="#f8fafc" font-size="18" font-weight="bold">Axiom Path Engine</text>
    <text x="0" y="42" fill="#64748b" font-size="13">BFS Optimal Grid Solver • Sub-1ms CPU</text>

    <!-- Next Move & Probabilities Header -->
    <text x="0" y="85" fill="#f8fafc" font-size="13" font-weight="bold" letter-spacing="1">NEXT MOVE</text>
    <text x="150" y="85" fill="#64748b" font-size="13" font-weight="bold" letter-spacing="1">PATH PROBABILITIES</text>

    <!-- Probability Bars -->
    <text x="0" y="115" fill="#a855f7" font-size="14" font-weight="bold">&gt; MOVE_DOWN</text>
    <rect x="140" y="104" width="140" height="14" fill="#a855f7">
      <animate attributeName="width" values="140;155;140" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="280" y="115" fill="#a855f7" font-size="14" font-weight="bold">0.98</text>

    <text x="16" y="140" fill="#64748b" font-size="13">MOVE_RIGHT</text>
    <rect x="140" y="129" width="15" height="14" fill="#334155"/>
    <text x="280" y="140" fill="#64748b" font-size="13">0.02</text>

    <text x="24" y="165" fill="#64748b" font-size="13">MOVE_LEFT</text>
    <rect x="140" y="154" width="0" height="14" fill="#334155"/>
    <text x="280" y="165" fill="#64748b" font-size="13">0.00</text>

    <text x="40" y="190" fill="#64748b" font-size="13">MOVE_UP</text>
    <rect x="140" y="179" width="0" height="14" fill="#334155"/>
    <text x="280" y="190" fill="#64748b" font-size="13">0.00</text>

    <!-- Executing Action -->
    <text x="0" y="235" fill="#64748b" font-size="13">EXECUTING</text>
    <text x="120" y="235" fill="#a855f7" font-size="15" font-weight="bold">MOVE_DOWN</text>

    <!-- Risk Metrics -->
    <text x="0" y="270" fill="#64748b" font-size="12">PATH OPTIMALITY</text>
    <rect x="0" y="280" width="220" height="2" fill="#1e293b"/>
    <rect x="0" y="280" width="220" height="2" fill="#a855f7"/>
    <text x="280" y="275" fill="#a855f7" font-size="13">1.00</text>

    <text x="0" y="315" fill="#64748b" font-size="12">DEAD-END RISK</text>
    <rect x="0" y="325" width="220" height="2" fill="#1e293b"/>
    <rect x="0" y="325" width="0" height="2" fill="#22c55e"/>
    <text x="280" y="320" fill="#22c55e" font-size="13">0.00</text>

    <!-- System Telemetry Stats -->
    <g transform="translate(0, 355)" font-size="12">
      <text x="0" y="0" fill="#64748b">INFERENCE</text>
      <text x="160" y="0" fill="#4ade80" font-weight="bold">0.07 ms</text>

      <text x="0" y="20" fill="#64748b">DECISIONS</text>
      <text x="160" y="20" fill="#f8fafc" font-weight="bold">14,285 /s</text>

      <text x="0" y="40" fill="#64748b">NETWORK</text>
      <text x="160" y="40" fill="#38bdf8" font-weight="bold">OFFLINE (0 Cloud Fees)</text>

      <text x="0" y="60" fill="#64748b">ENGINE</text>
      <text x="160" y="60" fill="#a855f7" font-weight="bold">Axiom Fast • Sub-1ms CPU</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <line x1="0" y1="500" x2="960" y2="500" stroke="#1e293b" stroke-width="1.5"/>
  <text x="36" y="524" fill="#64748b" font-family="monospace" font-size="12">SPACE pause    ↑/↓ speed    R reset    Q quit</text>
  <text x="924" y="524" fill="#475569" font-family="monospace" font-size="12" text-anchor="end">ESTIMATES BY AXIOM AI ENGINE</text>
</svg>
