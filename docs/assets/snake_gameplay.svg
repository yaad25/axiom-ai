<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#14532d" rx="10"/>
  
  <!-- Grid -->
  <path d="M 0 40 L 600 40 M 0 80 L 600 80 M 0 120 L 600 120 M 0 160 L 600 160 M 0 200 L 600 200 M 0 240 L 600 240 M 0 280 L 600 280" stroke="#166534" stroke-width="1"/>
  <path d="M 40 0 L 40 320 M 80 0 L 80 320 M 120 0 L 120 320 M 160 0 L 160 320 M 200 0 L 200 320 M 240 0 L 240 320 M 280 0 L 280 320 M 320 0 L 320 320 M 360 0 L 360 320 M 400 0 L 400 320 M 440 0 L 440 320 M 480 0 L 480 320 M 520 0 L 520 320 M 560 0 L 560 320" stroke="#166534" stroke-width="1"/>

  <!-- Header Overlay -->
  <rect x="15" y="10" width="570" height="32" fill="#052e16" rx="6" stroke="#15803d" stroke-width="1"/>
  <text x="25" y="31" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">GAMEPLAY: SNAKE AUTO-PILOT AI</text>
  <text x="360" y="31" fill="#86efac" font-family="monospace" font-size="12">MOVE: TURN_RIGHT (0.04ms)</text>

  <!-- Snake Body Path Animation -->
  <g fill="#22c55e" stroke="#86efac" stroke-width="1.5">
    <rect x="240" y="160" width="36" height="36" rx="4"/>
    <rect x="240" y="120" width="36" height="36" rx="4"/>
    <rect x="240" y="80" width="36" height="36" rx="4"/>
    <rect x="280" y="80" width="36" height="36" rx="4"/>
    <rect x="320" y="80" width="36" height="36" rx="4"/>
  </g>
  
  <!-- Snake Head (Glowing Green) -->
  <rect x="360" y="80" width="36" height="36" rx="6" fill="#4ade80" stroke="#ffffff" stroke-width="2">
    <animate attributeName="opacity" values="1;0.7;1" dur="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Food (Apple) -->
  <circle cx="460" cy="98" r="14" fill="#ef4444" stroke="#fca5a5" stroke-width="2">
    <animate attributeName="r" values="12;16;12" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom AI Stats Overlay -->
  <rect x="15" y="280" width="570" height="30" fill="#052e16" rx="4" stroke="#15803d" stroke-width="1"/>
  <text x="25" y="300" fill="#86efac" font-family="monospace" font-size="11">DECISION PROBABILITIES: [TURN_RIGHT: 99.1% | GO_STRAIGHT: 0.8% | TURN_LEFT: 0.1%]</text>
</svg>
