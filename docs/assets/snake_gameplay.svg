<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Dark Window Frame -->
  <rect width="960" height="540" fill="#090d12" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <!-- macOS Window Header Buttons -->
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="46" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="24" r="6" fill="#10b981"/>
  
  <!-- Title bar text -->
  <text x="480" y="28" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">axiom-snake / real recorded decisions</text>

  <line x1="0" y1="48" x2="960" y2="48" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Info Row -->
  <text x="36" y="80" fill="#94a3b8" font-family="monospace" font-size="16" font-weight="bold">AXIOM AI <tspan fill="#475569"> / </tspan> LOCAL INTELLIGENCE</text>
  <text x="924" y="80" fill="#22c55e" font-family="monospace" font-size="14" text-anchor="end" font-weight="bold">RECORDED RUN • 1x</text>

  <!-- Left Game Section -->
  <text x="36" y="125" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="4">S N A K E</text>
  <text x="360" y="125" fill="#64748b" font-family="monospace" font-size="14" text-anchor="end">ROUND 01</text>

  <!-- Game Grid Container -->
  <rect x="36" y="145" width="330" height="270" fill="#020617" stroke="#1e293b" stroke-width="2" rx="4"/>
  
  <!-- Grid Lines -->
  <path d="M 36 175 L 366 175 M 36 205 L 366 205 M 36 235 L 366 235 M 36 265 L 366 265 M 36 295 L 366 295 M 36 325 L 366 325 M 36 355 L 366 355 M 36 385 L 366 385" stroke="#0f172a" stroke-width="1"/>
  <path d="M 66 145 L 66 415 M 96 145 L 96 415 M 126 145 L 126 415 M 156 145 L 156 415 M 186 145 L 186 415 M 216 145 L 216 415 M 246 145 L 246 415 M 276 145 L 276 415 M 306 145 L 306 415 M 336 145 L 336 415" stroke="#0f172a" stroke-width="1"/>

  <!-- Food Item (Glowing Yellow Dot) -->
  <circle cx="141" cy="190" r="7" fill="#fde047" stroke="#fef08a" stroke-width="2">
    <animate attributeName="r" values="6;8;6" dur="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Green Snake Body -->
  <g fill="#22c55e" stroke="#15803d" stroke-width="1">
    <rect x="336" y="385" width="28" height="28" fill="#f8fafc"/>
    <rect x="336" y="355" width="28" height="28"/>
    <rect x="336" y="325" width="28" height="28"/>
    <rect x="336" y="295" width="28" height="28"/>
    <rect x="336" y="265" width="28" height="28"/>
    <rect x="306" y="265" width="28" height="28"/>
    <rect x="276" y="265" width="28" height="28"/>
    <rect x="276" y="235" width="28" height="28"/>
    <rect x="276" y="205" width="28" height="28"/>
    <rect x="246" y="205" width="28" height="28"/>
    <rect x="216" y="205" width="28" height="28"/>
    <rect x="186" y="205" width="28" height="28"/>
    <rect x="156" y="205" width="28" height="28"/>
    <rect x="156" y="175" width="28" height="28"/>
  </g>

  <!-- Score Board Section -->
  <g font-family="monospace">
    <text x="36" y="445" fill="#64748b" font-size="12">SCORE</text>
    <text x="36" y="485" fill="#4ade80" font-size="34" font-weight="bold">027</text>

    <text x="160" y="445" fill="#64748b" font-size="12">LENGTH</text>
    <text x="160" y="485" fill="#f8fafc" font-size="34" font-weight="bold">033</text>

    <text x="280" y="445" fill="#64748b" font-size="12">BEST</text>
    <text x="280" y="485" fill="#64748b" font-size="34" font-weight="bold">027</text>

    <rect x="36" y="505" width="330" height="4" fill="#1e293b" rx="2"/>
    <rect x="36" y="505" width="280" height="4" fill="#22c55e" rx="2"/>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(420, 110)" font-family="monospace">
    <text x="0" y="20" fill="#f8fafc" font-size="18" font-weight="bold">Axiom Fast Engine</text>
    <text x="0" y="42" fill="#64748b" font-size="13">Sub-1ms CPU • Local Intelligence</text>

    <!-- Next Move & Probabilities Header -->
    <text x="0" y="85" fill="#f8fafc" font-size="13" font-weight="bold" letter-spacing="1">NEXT MOVE</text>
    <text x="150" y="85" fill="#64748b" font-size="13" font-weight="bold" letter-spacing="1">MODEL PROBABILITIES</text>

    <!-- Probability Bars -->
    <!-- UP -->
    <text x="40" y="115" fill="#64748b" font-size="13">UP</text>
    <rect x="80" y="104" width="15" height="14" fill="#334155"/>
    <text x="280" y="115" fill="#64748b" font-size="13">0.07</text>

    <!-- DOWN -->
    <text x="24" y="140" fill="#64748b" font-size="13">DOWN</text>
    <rect x="80" y="129" width="10" height="14" fill="#334155"/>
    <text x="280" y="140" fill="#64748b" font-size="13">0.05</text>

    <!-- LEFT (Active Highlighted) -->
    <text x="0" y="165" fill="#4ade80" font-size="14" font-weight="bold">&gt; LEFT</text>
    <rect x="80" y="154" width="170" height="14" fill="#4ade80">
      <animate attributeName="width" values="170;185;170" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="280" y="165" fill="#4ade80" font-size="14" font-weight="bold">0.72</text>

    <!-- RIGHT -->
    <text x="16" y="190" fill="#64748b" font-size="13">RIGHT</text>
    <rect x="80" y="179" width="35" height="14" fill="#334155"/>
    <text x="280" y="190" fill="#64748b" font-size="13">0.16</text>

    <!-- Executing Action -->
    <text x="0" y="235" fill="#64748b" font-size="13">EXECUTING</text>
    <text x="120" y="235" fill="#4ade80" font-size="15" font-weight="bold">LEFT</text>

    <!-- Risk Metrics -->
    <text x="0" y="270" fill="#64748b" font-size="12">DEAD-END RISK</text>
    <rect x="0" y="280" width="220" height="2" fill="#1e293b"/>
    <rect x="0" y="280" width="15" height="2" fill="#f59e0b"/>
    <text x="280" y="275" fill="#f59e0b" font-size="13">0.07</text>

    <text x="0" y="315" fill="#64748b" font-size="12">FOOD REACHABLE</text>
    <rect x="0" y="325" width="220" height="2" fill="#1e293b"/>
    <rect x="0" y="325" width="200" height="2" fill="#4ade80"/>
    <text x="280" y="320" fill="#4ade80" font-size="13">0.93</text>

    <!-- System Telemetry Stats -->
    <g transform="translate(0, 355)" font-size="12">
      <text x="0" y="0" fill="#64748b">INFERENCE</text>
      <text x="160" y="0" fill="#4ade80" font-weight="bold">0.07 ms</text>

      <text x="0" y="20" fill="#64748b">DECISIONS</text>
      <text x="160" y="20" fill="#f8fafc" font-weight="bold">14,285 /s</text>

      <text x="0" y="40" fill="#64748b">NETWORK</text>
      <text x="160" y="40" fill="#38bdf8" font-weight="bold">OFFLINE (0 Cloud Fees)</text>

      <text x="0" y="60" fill="#64748b">ENGINE</text>
      <text x="160" y="60" fill="#a855f7" font-weight="bold">Axiom Fast • Sub-1ms CPU</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <line x1="0" y1="500" x2="960" y2="500" stroke="#1e293b" stroke-width="1.5"/>
  <text x="36" y="524" fill="#64748b" font-family="monospace" font-size="12">SPACE pause    ↑/↓ speed    R reset    Q quit</text>
  <text x="924" y="524" fill="#475569" font-family="monospace" font-size="12" text-anchor="end">ESTIMATES BY AXIOM AI ENGINE</text>
</svg>
